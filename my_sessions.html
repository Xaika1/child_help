<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои записи</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    body {
      --bs-body-bg: rgb(34, 34, 34);
      height: 100vh;
    }

    .offcanvas-custom {
      width: 200px !important;
      max-width: 90vw;
    }

    .offcanvas-start,
    .offcanvas-end {
      top: 60px !important;
      height: calc(100vh - 60px) !important;
    }

    /* Основная секция */
    section {
      padding-top: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
      min-height: 100vh;
      background-color: rgb(62, 62, 62);
    }

    /* Кнопка-шторка */
    .curtain-btn {
      position: fixed !important;
      margin-top: 75px;
      margin-left: 15px;
      z-index: 1046;
      width: 40px;
      height: 40px;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .curtain-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Пульсирующий индикатор статуса */
    .pulse-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%   { opacity: 1;   transform: scale(1); }
      50%  { opacity: 0.5; transform: scale(0.95); }
      100% { opacity: 1;   transform: scale(1); }
    }

    /* Карточка записи */
    .booking-card {
      width: 100%;
      max-width: 38rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .booking-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.4) !important;
    }

    .booking-card .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .booking-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin-bottom: 1rem;
      color: var(--bs-secondary-color);
      font-size: 0.9rem;
    }

    .booking-meta .item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Child free</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarScroll">
        <ul class="navbar-nav ms-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
          <li class="nav-item"><a class="nav-link" href="#">Войти</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Авторизоваться</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Кнопка-шторка -->
  <button class="btn fixed-top btn-outline-secondary curtain-btn"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasScrolling"
          aria-controls="offcanvasScrolling">
    <img src="https://img.icons8.com/?size=100&id=quuyJoZCkYni&format=png&color=ffffff" alt="Меню">
  </button>

  <!-- Offcanvas меню -->
  <div class="offcanvas offcanvas-start offcanvas-custom" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel" data-bs-theme="dark">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasScrollingLabel">Меню</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="d-grid gap-2">
        <button class="btn btn-outline-primary" type="button" data-bs-dismiss="offcanvas" onclick="window.location.href='#'">Главная</button>
        <hr class="divider">
        <button class="btn btn-outline-light" type="button" data-bs-dismiss="offcanvas" onclick="window.location.href='#'">Мои записи</button>
      </div>
    </div>
  </div>

  <!-- Основной контент -->
  <section class="py-4">
    <div class="container d-flex flex-column align-items-center gap-4">

      <h1 class="h3 text-white text-center mb-0">Мои записи</h1>

      <!-- Карточка 1 — активная -->
      <div class="card text-white bg-dark booking-card shadow-sm">
        <div class="card-body">
          <div class="card-title">
            <h5 class="mb-0"><span class="item">👤 Мастер: Иван</span></h5>
          </div>

          <div class="booking-meta">
            <span class="item">📅 15 сентября 2026</span>
            <span class="item">🕒 14:00</span>
            
          </div>

          <p class="card-text text-secondary small mb-3">
            Комментарий: без комментария
          </p>

          <div class="d-flex gap-2">
            
            <button type="button" class="btn btn-sm btn-outline-danger">
              Отменить
            </button>
          </div>
        </div>
      </div>

      

      <!-- Заглушка, если записей нет -->
      <!--
      <div class="card text-white bg-dark booking-card shadow-sm">
        <div class="card-body text-center py-5">
          <p class="text-secondary mb-3">У вас пока нет записей</p>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookingModal">
            Записаться
          </button>
        </div>
      </div>
      -->

    </div>

    <!-- ↓ Модальное окно -->
    <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content text-white">
          <div class="modal-header">
            <h5 class="modal-title" id="bookingModalLabel">Запись</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>

          <form>
            <div class="modal-body">
              <div class="mb-3">
                <label for="bookingDate" class="form-label">Выберите день</label>
                <input type="date" class="form-control" id="bookingDate" name="date" required>
              </div>

              <div class="mb-3">
                <label for="bookingTime" class="form-label">Выберите время</label>
                <select class="form-select" id="bookingTime" name="time" required>
                  <option selected disabled value="">-- Выберите время --</option>
                  <option value="09:00">09:00</option>
                  <option value="10:00">10:00</option>
                  <option value="11:00">11:00</option>
                  <option value="12:00">12:00</option>
                  <option value="13:00">13:00</option>
                  <option value="14:00">14:00</option>
                  <option value="15:00">15:00</option>
                  <option value="16:00">16:00</option>
                  <option value="17:00">17:00</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="bookingComment" class="form-label">Комментарий</label>
                <textarea class="form-control" id="bookingComment" name="comment" rows="2" placeholder="Необязательно"></textarea>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
              <button type="submit" class="btn btn-primary">Подтвердить</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
